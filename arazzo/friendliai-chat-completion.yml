arazzo: 1.0.1
info:
  title: FriendliAI chat completion
  version: 1.0.0
  summary: Discover a serverless model then generate a chat completion.
  x-realizes-capability-ids:
  - BC-610.60
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-610.60
      capability_name: Artificial Intelligence Management
      spec: friendliai-serverless-chat-api-openapi.yml
      confidence: 0.8
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: serverlessChatApi
  url: ../openapi/friendliai-serverless-chat-api-openapi.yml
  type: openapi
- name: serverlessModelApi
  url: ../openapi/friendliai-serverless-model-api-openapi.yml
  type: openapi
workflows:
- workflowId: chat-completion
  summary: List available Model APIs models, then send a chat completion.
  inputs:
    type: object
    properties:
      token:
        type: string
      model:
        type: string
      prompt:
        type: string
  steps:
  - stepId: listModels
    operationId: serverlessModelList
  - stepId: chat
    operationId: serverlessChatComplete
    requestBody:
      contentType: application/json
      payload:
        model: $inputs.model
        messages:
        - role: user
          content: $inputs.prompt
    outputs:
      content: $response.body
