arazzo: 1.0.1
info:
  title: FriendliAI deploy a Dedicated Endpoint and infer
  version: 1.0.0
  summary: Create a Dedicated Endpoint, wait for it to be ready, then run a chat completion.
  x-realizes-capability-ids:
  - BC-610.60
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-610.60
      capability_name: Artificial Intelligence Management
      spec: friendliai-dedicated-endpoint-api-openapi.yml
      confidence: 0.8
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: dedicatedChatApi
  url: ../openapi/friendliai-dedicated-chat-api-openapi.yml
  type: openapi
- name: dedicatedEndpointApi
  url: ../openapi/friendliai-dedicated-endpoint-api-openapi.yml
  type: openapi
workflows:
- workflowId: deploy-and-infer
  summary: Create a Dedicated Endpoint, poll status, then send inference to it.
  inputs:
    type: object
    properties:
      token:
        type: string
      model:
        type: string
      prompt:
        type: string
  steps:
  - stepId: createEndpoint
    operationId: dedicatedCreateEndpoint
    outputs:
      endpointId: $response.body#/id
  - stepId: checkStatus
    operationId: dedicatedGetEndpointStatus
    parameters:
    - name: endpoint_id
      in: path
      value: $steps.createEndpoint.outputs.endpointId
  - stepId: infer
    operationId: dedicatedChatComplete
    requestBody:
      contentType: application/json
      payload:
        model: $inputs.model
        messages:
        - role: user
          content: $inputs.prompt
    outputs:
      content: $response.body
