aid: friendliai
name: FriendliAI
description: >-
  FriendliAI is an AI inference cloud that runs generative AI models fast, affordably, and reliably
  at scale. Its Friendli Suite spans three products: Model APIs (serverless, pay-per-token access to
  popular open-weight LLMs and multimodal models), Dedicated Endpoints (any open-source or custom
  model on dedicated GPUs with autoscaling, versioning, multi-LoRA and speculative decoding), and
  Friendli Container (self-hosted inference with gRPC, quantization and policy search). The API is
  OpenAI-compatible, so existing OpenAI applications migrate by changing the base URL and API key,
  with support for chat completions, tool calling, structured outputs, reasoning, audio transcription,
  embeddings and image generation. FriendliAI is a portfolio company of Sierra Ventures.
