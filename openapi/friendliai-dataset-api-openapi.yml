components:
  schemas:
    CreateDatasetRequest:
      properties:
        name:
          type: string
          title: Name
          description: Name of the dataset.
        projectId:
          type: string
          title: Projectid
          description: ID of the project.
        modality:
          $ref: '#/components/schemas/DedicatedDatasetModality'
          description: Modality of the dataset.
      type: object
      required:
      - name
      - projectId
      - modality
      title: CreateDatasetRequest
      description: Create dataset request.
    SplitInfo:
      properties:
        id:
          type: string
          title: Id
          description: ID of the split.
        name:
          type: string
          title: Name
          description: Name of the split.
        createdAt:
          type: integer
          title: Createdat
          description: Unix timestamp (in seconds) of when the split was created.
        updatedAt:
          type: integer
          title: Updatedat
          description: Unix timestamp (in seconds) of when the split was last modified.
      type: object
      required:
      - id
      - name
      - createdAt
      - updatedAt
      title: SplitInfo
      description: Split info.
    ListSamplesResponse:
      properties:
        data:
          items:
            prefixItems:
            - type: string
            - type: string
            type: array
            maxItems: 2
            minItems: 2
          type: array
          title: Data
          description: List of items.
        nextCursor:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Nextcursor
          description: Next cursor to use for pagination. `None` indicates no more items to fetch.
      type: object
      required:
      - data
      title: ListSamplesResponse
      description: List samples response.
    ListVersionsResponse:
      properties:
        versions:
          items:
            $ref: '#/components/schemas/VersionInfo'
          type: array
          title: Versions
          description: List of versions.
      type: object
      required:
      - versions
      title: ListVersionsResponse
      description: List versions response.
    Body_upload_raw_samples:
      properties:
        file:
          type: string
          format: binary
          title: File
          description: File to update samples.
      type: object
      required:
      - file
      title: Body_upload_raw_samples
    ListSplitsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/SplitInfo'
          type: array
          title: Data
          description: List of items.
        nextCursor:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Nextcursor
          description: Next cursor to use for pagination. `None` indicates no more items to fetch.
      type: object
      required:
      - data
      title: ListSplitsResponse
      description: List splits response.
    VersionInfo:
      properties:
        id:
          type: string
          title: Id
          description: ID of the version.
        comment:
          type: string
          title: Comment
          description: Comment for the version.
        createdAt:
          type: integer
          title: Createdat
          description: Unix timestamp (in seconds) of when the version was created.
      type: object
      required:
      - id
      - comment
      - createdAt
      title: VersionInfo
      description: Version info.
    AddSamplesResponse:
      properties:
        samples:
          items:
            prefixItems:
            - type: string
            - type: string
            type: array
            maxItems: 2
            minItems: 2
          type: array
          title: Samples
          description: List of sample IDs that were added to the dataset.
      type: object
      required:
      - samples
      title: AddSamplesResponse
      description: Add samples response.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DedicatedDatasetModality:
      properties:
        input_modals:
          items:
            $ref: '#/components/schemas/DedicatedDatasetModalityType'
          type: array
          title: Input Modals
          default: []
        output_modals:
          items:
            $ref: '#/components/schemas/DedicatedDatasetModalityType'
          type: array
          title: Output Modals
          default: []
      type: object
      title: DedicatedDatasetModality
      description: Dataset modality.
    DeleteSamplesResponse:
      properties:
        sampleIds:
          items:
            type: string
          type: array
          title: Sampleids
          description: List of sample IDs that were deleted from the dataset.
      type: object
      required:
      - sampleIds
      title: DeleteSamplesResponse
      description: Delete samples response.
    DatasetInfo:
      properties:
        id:
          type: string
          title: Id
          description: ID of the dataset.
        name:
          type: string
          title: Name
          description: Name of the dataset.
        createdAt:
          type: integer
          title: Createdat
          description: Unix timestamp (in seconds) of when the dataset was created.
        updatedAt:
          type: integer
          title: Updatedat
          description: Unix timestamp (in seconds) of when the dataset was last modified.
        modality:
          $ref: '#/components/schemas/DedicatedDatasetModality'
          description: Modality of the dataset.
      type: object
      required:
      - id
      - name
      - createdAt
      - updatedAt
      - modality
      title: DatasetInfo
      description: Dataset info.
    DedicatedDatasetModalityType:
      type: string
      enum:
      - VIDEO
      - IMAGE
      - AUDIO
      - TEXT
      title: DedicatedDatasetModalityType
      description: Modality type.
    ListDatasetsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/DatasetInfo'
          type: array
          title: Data
          description: List of items.
        nextCursor:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Nextcursor
          description: Next cursor to use for pagination. `None` indicates no more items to fetch.
      type: object
      required:
      - data
      title: ListDatasetsResponse
      description: List datasets response.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    token:
      type: http
      description: 'When using Friendli Suite API for inference requests, you need to provide a **Friendli Token** for authentication and authorization purposes.


        For more detailed information, please refer [here](https://friendli.ai/docs/openapi/introduction#authentication).'
      scheme: bearer
