      summary: List all endpoints
      description: List all endpoint statuses
      operationId: dedicatedListEndpoints
      security:
      - token: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the project. If omitted, query all endpoints under the team.
          default: ''
          title: Project Id
        description: The ID of the project. If omitted, query all endpoints under the team.
