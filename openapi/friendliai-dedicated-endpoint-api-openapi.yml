          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedEndpointListResponse'
              examples:
                Example:
                  value:
                    data:
                      endpoint-id-1:
                        status: INITIALIZING
                        createdAt: '2025-01-01T00:00:00Z'
                        updatedAt: '2025-01-01T00:00:00Z'
                        phase: DOWNLOADING_MODEL
                      endpoint-id-2:
                        status: RUNNING
                        createdAt: '2025-01-01T00:00:00Z'
                        updatedAt: '2025-01-01T00:00:00Z'
        '400':
          description: Bad Request
        '422':
          description: Unprocessable Entity
